<title>Plotline — 2D Graphing Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: expression list + math keyboard on the left, square-unit graph canvas filling the rest; stacks (graph first) on phones. */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --canvas: #ffffff;
  --line: #dde2e9;
  --fg: #1b2330;
  --muted: #667085;
  --accent: #2d70b3;
  --key: #eef1f5;
  --key-op: #e1ebf6;
  --grid-minor: #eceff4;
  --grid-major: #d5dae2;
  --axis: #3b4454;
  --err: #b42318;
  --c0: #c74440; --c1: #2d70b3; --c2: #388c46; --c3: #6042a6; --c4: #d9730d; --c5: #0f8b8d;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-math: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --panel: #171b22; --canvas: #12161c; --line: #2a303b; --fg: #e5e9f0; --muted: #98a2b3;
    --accent: #6aa6e8; --key: #212732; --key-op: #1f3350; --grid-minor: #1b212a; --grid-major: #2a313c; --axis: #aab3c2; --err: #f97066;
    --c0: #ef7a76; --c1: #6aa6e8; --c2: #6cc27c; --c3: #a28be0; --c4: #f0a04b; --c5: #4cc3c5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --panel: #171b22; --canvas: #12161c; --line: #2a303b; --fg: #e5e9f0; --muted: #98a2b3;
  --accent: #6aa6e8; --key: #212732; --key-op: #1f3350; --grid-minor: #1b212a; --grid-major: #2a313c; --axis: #aab3c2; --err: #f97066;
  --c0: #ef7a76; --c1: #6aa6e8; --c2: #6cc27c; --c3: #a28be0; --c4: #f0a04b; --c5: #4cc3c5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 12px; }
.side, .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; min-height: 0; }
.side { display: flex; flex-direction: column; overflow: hidden; }
.head { padding: 12px 14px 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.head h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.kbt { border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 6px; padding: 5px 10px; font: 500 12px var(--font-ui); cursor: pointer; }
.kbt:hover { background: var(--bg); }
.kbt[aria-expanded="true"] { background: var(--key-op); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 28px; align-items: start; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); }
.row:focus-within { background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.dot { width: 22px; height: 22px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--c); background: var(--c); padding: 0; cursor: pointer; }
.dot[aria-pressed="false"] { background: transparent; }
.row input[type="text"] { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 500 15px/1.6 var(--font-math); padding: 3px 2px; outline: none; }
.row input[type="text"]::placeholder { color: var(--muted); font-weight: 400; }
.err { grid-column: 2; color: var(--err); font-size: 12px; margin-top: -2px; }
.err:empty { display: none; }
.x { width: 28px; height: 28px; margin-top: 1px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
.x:hover { background: var(--bg); color: var(--fg); }

.add { margin: 12px 14px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--accent); font: 500 13px var(--font-ui); cursor: pointer; width: calc(100% - 28px); }
.add:hover { background: var(--bg); }
.sliders { padding: 4px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
.sliders h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 0; font-weight: 600; }
.sl { display: grid; grid-template-columns: 22px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
.sl b { font: 500 14px var(--font-math); }
.sl output { font: 400 12px var(--font-math); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.hint { padding: 10px 16px 14px; color: var(--muted); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--line); }
.hint code { font-family: var(--font-math); color: var(--fg); }
.kb { border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
.kb-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.kb-tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-ui); padding: 7px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.kb-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.kb-pad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 8px 10px 10px; max-height: 232px; overflow-y: auto; }
.k { height: 34px; border: 1px solid var(--line); background: var(--key); color: var(--fg); border-radius: 6px; font: 500 14px var(--font-math); cursor: pointer; padding: 0 2px; overflow: hidden; white-space: nowrap; }
.k:hover { border-color: var(--accent); }
.k:active { background: var(--key-op); }
.k.op { background: var(--key-op); }
.k.act { color: var(--accent); }
.k.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.stage { position: relative; overflow: hidden; background: var(--canvas); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#cv:active { cursor: grabbing; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.tools button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; cursor: pointer; font: 500 17px var(--font-ui); display: grid; place-items: center; }
.tools button:hover { background: var(--bg); }
.readout { position: absolute; left: 10px; bottom: 8px; font: 400 12px var(--font-math); color: var(--muted); background: color-mix(in srgb, var(--canvas) 82%, transparent); padding: 2px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; pointer-events: none; }
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(240px, 48%) minmax(0, 1fr); }
  .app.kbopen { grid-template-rows: minmax(150px, 30%) minmax(0, 1fr); }
  .stage { order: -1; }
  .kb-pad { max-height: 190px; }
}
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="head">
      <h1>Plotline</h1>
      <button class="kbt" id="kbt" type="button" aria-expanded="true" aria-controls="kb">Keyboard</button>
    </div>
    <div class="scroll">
      <div class="rows" id="rows"></div>
      <button class="add" id="add" type="button">+ Add expression</button>
      <div class="sliders" id="sliders"></div>
      <div class="hint">Try <code>y = sin(x)</code>, <code>x^2 + y^2 = 9</code>, <code>y &gt; x^2 - 3</code>, <code>(2, 3)</code> or <code>a = 1</code> for a slider. Sums, products, integrals and derivatives are on the keyboard. Drag to pan, scroll or pinch to zoom.</div>
    </div>
    <div class="kb" id="kb">
      <div class="kb-tabs" id="tabs" role="tablist"></div>
      <div class="kb-pad" id="pad"></div>
    </div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Graph"></canvas>
    <div class="tools">
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
      <button id="home" type="button" aria-label="Reset view" title="Reset view">&#8962;</button>
    </div>
    <div class="readout" id="ro">x = 0, y = 0</div>
  </main>
</div>

<script>

  function redraw() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; draw(); }); }

  /* ---------- view controls ---------- */
  function zoomAt(px, py, f) {
    var wx = S.cx + (px - W / 2) / S.s, wy = S.cy - (py - H / 2) / S.s;
    S.s = Math.min(1e5, Math.max(1e-3, S.s * f));
    S.cx = wx - (px - W / 2) / S.s; S.cy = wy + (py - H / 2) / S.s;
  }
  function home() { S.cx = 0; S.cy = 0; S.s = Math.min(W, H) / 14; redraw(); }
  var ptrs = new Map(), lastDist = 0;
  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (ptrs.size === 2) { var a = Array.from(ptrs.values()); lastDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
  });
  cv.addEventListener("pointermove", function (e) {
    var wx = S.cx + (e.offsetX - W / 2) / S.s, wy = S.cy - (e.offsetY - H / 2) / S.s;
    var dec = Math.min(8, Math.max(0, Math.ceil(Math.log10(S.s))));
    ro.textContent = "x = " + wx.toFixed(dec) + ", y = " + wy.toFixed(dec);
    var p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) { S.cx -= (e.offsetX - p.x) / S.s; S.cy += (e.offsetY - p.y) / S.s; }
    p.x = e.offsetX; p.y = e.offsetY;
    if (ptrs.size === 2) {
      var a = Array.from(ptrs.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (lastDist) zoomAt((a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2, d / lastDist);
      lastDist = d;
    }
    redraw();
  });
  function up(e) { ptrs.delete(e.pointerId); lastDist = 0; }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var k = e.deltaMode === 1 ? 30 : 1;
    zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * k * 0.0015)); redraw();
  }, { passive: false });
  document.getElementById("zin").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1.4); redraw(); });
  document.getElementById("zout").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1 / 1.4); redraw(); });
  document.getElementById("home").addEventListener("click", home);

  function resize() {
    var b = stage.getBoundingClientRect();
    W = Math.max(50, b.width); H = Math.max(50, b.height); DPR = window.devicePixelRatio || 1;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (!inited) { S.s = Math.min(W, H) / 14; inited = true; }
    draw();
  }
  new ResizeObserver(resize).observe(stage);
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw); } catch (e) {}
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- start ---------- */
  var start = null;
  try { start = JSON.parse(localStorage.getItem("plotline.v2") || "null"); } catch (e) {}
  if (!Array.isArray(start) || !start.length) {
    start = [{ t: "a = 1.5" }, { t: "b = 2" }, { t: "y = a sin(b x)" }, { t: "y = x^2 / 4 - 3" }, { t: "x^2 + y^2 = 9" }, { t: "y > sum(k, k, 1, 3) - 4" }, { t: "(1.5, 2)" }];
  }
  start.forEach(function (o) { S.rows.push(makeRow(String(o.t || ""), o.v !== false)); });
  renderTabs(); renderPad();
  var wide = true;
  try { wide = window.matchMedia("(min-width: 721px)").matches; } catch (e) {}
  setKb(wide);
  renderRows(null);
  syncParams(null);
  resize();
})();
</script>

<script>
/* Theme sync: the portfolio page tells this calculator whether it is light or dark. */
addEventListener('message', function (e) {
  if (e.source !== window.parent) return;
  var d = e.data;
  if (d && d.type === 'plotline-theme' && (d.theme === 'light' || d.theme === 'dark'))
    document.documentElement.setAttribute('data-theme', d.theme);
});
</script>
